[project]
name = "tri-mail"
version = "0.1.0"
description = "Architecture skeleton for a LangGraph email triage agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0",
	"google-api-python-client>=2.150.0",
	"google-auth-oauthlib>=1.2.1",
	"langchain-core>=0.3.0",
	"langgraph>=0.2.0",
	"langgraph-checkpoint-postgres>=2.0.0",
	"pydantic-settings>=2.6.0",
	"uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
	"pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
